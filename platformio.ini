; PlatformIO Project Configuration File
;
; Golf Swing Analyzer - ESP32 Firmware
; Board: XIAO ESP32S3
; Sensor: ICM-20948 9-DOF IMU
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Automatically detect upload port
; Uncomment and set manually if needed:
; upload_port = COM10
; monitor_port = COM10

lib_deps = 
    ; Adafruit ICM20X library for ICM-20948 sensor
    adafruit/Adafruit ICM20X @ ^2.0.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14

build_flags = 
    ; Optimize for performance
    -O2
